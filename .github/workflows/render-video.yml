name: Render video

on:
  workflow_dispatch:

jobs:
  render:
    name: Render Remotion video
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Render video
        run: npx remotion render MyComp out/video.mp4 --concurrency=2

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: remotion-video
          path: out/video.mp4
          if-no-files-found: error
